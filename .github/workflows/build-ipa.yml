name: Build Unsigned iOS IPA

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build & Package Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment
        run: |
          flutter doctor -v
          flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze lib test

      - name: Run Tests
        run: flutter test

      - name: Build iOS Release (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package Unsigned IPA & TIPA
        run: |
          set -euo pipefail
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qr AntigravityPlatformer.ipa Payload
          zip -qr AntigravityPlatformer.tipa Payload
          ls -lh

      - name: Upload IPA Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AntigravityPlatformer-unsigned-ipa
          path: |
            build/ios/ipa/*.ipa
            build/ios/ipa/*.tipa
          if-no-files-found: error
          retention-days: 14
